apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: flask-app
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_APP
              value: app.py
            - name: FLASK_ENV
              value: development
            - name: FLASK_DEBUG
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          workingDir: /app
          volumeMounts:
            - name: app-code
              mountPath: /app
          command:
            - /bin/sh
            - -c
            - |
              pip install --no-cache-dir -r requirements.txt &&
              flask run --host 0.0.0.0 --port 5000
      volumes:
        - name: app-code
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flask-app
spec:
  selector:
    app: flask-app
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: NodePort
